# Evaluation Configuration
# Used by: scripts/run_eval.py and src/causalmath/evaluation/

# Datasets to evaluate on
datasets:
  gsm8k:
    test_file: "data/raw/gsm8k/test.jsonl"
    max_new_tokens: 2048
    question_field: "question"
    answer_field: "answer"
  math500:
    test_file: "data/raw/math500/test.jsonl"
    max_new_tokens: 8192
    question_field: "problem"
    answer_field: "answer"
  commonsenseqa:
    test_file: "data/raw/commonsenseqa/test.jsonl"
    max_new_tokens: 2048
    question_field: "question"
    answer_field: "answerKey"
  aime:
    test_file: "data/raw/aime/test.jsonl"
    max_new_tokens: 16384
    question_field: "question"
    answer_field: "answer"

# Greedy evaluation defaults
greedy:
  batch_size: 4
  load_in_4bit: false
  thinking: true                             # Enable <think> mode for Qwen3

# Self-consistency evaluation (SC@N)
self_consistency:
  n: 5                                       # Samples per question
  temperature: 0.7
  top_p: 0.95
  batch_size: 1                              # Always 1 for SC (sequential sampling)

# Output paths
output_dir: "outputs/results"

# Models to compare (map short label → adapter or HF model ID)
models:
  original:   "Qwen/Qwen3-1.7B"
  causal_sft: "outputs/checkpoints/sft/qwen3_causal"
  noncausal_sft: "outputs/checkpoints/sft/qwen3_noncausal"
  dpo:        "outputs/checkpoints/dpo/qwen3_causal_dpo"
