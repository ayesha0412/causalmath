[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "causalmath"
version = "0.1.0"
description = "PNS-Guided Causal Chain-of-Thought Optimisation with DPO and Self-Distillation"
readme = "README.md"
license = { text = "All Rights Reserved" }
authors = [
    { name = "Ayesha Tahir Awan" },
    { name = "Ahmed Khan" },
    { name = "Mariam Zahid" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.26.0",
    "datasets>=2.18.0",
    "trl>=0.8.0",
    "sentencepiece",
    "protobuf",
    "scipy",
    "numpy",
    "pandas",
    "tqdm",
    "jsonlines",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
causalmath-curate   = "scripts.run_curation:main"
causalmath-train    = "scripts.run_training:main"
causalmath-eval     = "scripts.run_eval:main"
causalmath-distill  = "scripts.run_self_distill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
